<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - Aaushadhi Ayurveda</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#ffffff;
    color:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:900px;
    background:#ffffff;
    padding:40px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.success-icon{
    font-size:60px;
    color:#28a745;
    margin-bottom:20px;
}

h1{
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
}

p{
    font-size:16px;
    color:#555;
    margin-bottom:25px;
}

.product-img{
    width:250px;
    margin:20px auto;
}

.product-img img{
    width:100%;
    border-radius:10px;
}

.highlight{
    background:#f4fdf6;
    padding:15px;
    border-radius:8px;
    margin:20px 0;
    font-weight:500;
    color:#1a7f37;
}

.whatsapp-btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 28px;
    background:#25D366;
    color:#fff;
    font-size:16px;
    font-weight:600;
    text-decoration:none;
    border-radius:50px;
    transition:0.3s ease;
}

.whatsapp-btn:hover{
    background:#1ebe5d;
    transform:scale(1.05);
}

.footer{
    margin-top:30px;
    font-size:14px;
    color:#777;
}

@media(max-width:600px){
    .container{
        padding:25px;
    }
    h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="success-icon">✔</div>

    <h1>Thank You for Your Order!</h1>

    <p>Your request for <strong>Aaushadhi Ayurveda Man Power Capsules</strong> has been successfully received.</p>

    <div class="product-img">
        <!-- Replace image URL with your actual product image -->
        <img src="hh3.jpeg" alt="Aaushadhi Ayurveda Man Power Capsules">
    </div>

    <div class="highlight">
        Our health expert will contact you shortly to confirm your order.
    </div>

    <!-- Replace 91XXXXXXXXXX with your WhatsApp number -->
    <a href="https://wa.me/91XXXXXXXXXX" class="whatsapp-btn" target="_blank">
        Chat on WhatsApp
    </a>

    <div class="footer">
        © 2026 Aaushadhi Ayurveda | 100% Ayurvedic & Safe
    </div>

</div>

</body>
</html>
